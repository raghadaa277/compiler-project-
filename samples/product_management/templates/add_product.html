{% extends "base.html" %}

{% block title %}إضافة منتج جديد{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0">
                    <i class="fas fa-plus-circle"></i> إضافة منتج جديد
                </h4>
            </div>
            <div class="card-body">
                <form id="add-form" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label fw-bold">اسم المنتج</label>
                        <input type="text" id="add-name" class="form-control" placeholder="أدخل اسم المنتج" required />
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">السعر</label>
                        <input type="number" id="add-price" class="form-control" placeholder="أدخل سعر المنتج" step="0.01" required />
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">التفاصيل</label>
                        <textarea id="add-details" class="form-control" rows="5" placeholder="أدخل تفاصيل المنتج" required></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">صورة المنتج</label>
                        <input type="text" id="add-image" class="form-control" placeholder="اسم ملف الصورة (مثل: 1.png)" />
                        <small class="text-muted">ادخل اسم ملف الصورة الموجود في static/uploads</small>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-plus-circle"></i> إضافة المنتج
                        </button>
                        <a href="index.html" class="btn btn-secondary">
                            <i class="fas fa-arrow-right"></i> العودة للرئيسية
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
