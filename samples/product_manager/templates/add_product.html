{% extends 'base.html' %}

{% block css %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/add.css') }}">
{% endblock %}

{% block content %}

<div class="form-container">

    <h2>Add Product</h2>

    <form method="POST">

        <input type="text"
               name="image"
               placeholder="Image URL"
               required>

        <input type="text"
               name="name"
               placeholder="Product Name"
               required>

        <input type="number"
               name="price"
               placeholder="Product Price"
               required>

        <textarea name="details"
                  placeholder="Product Details"
                  required></textarea>

        <button type="submit">Add Product</button>

    </form>

</div>

{% endblock %}
