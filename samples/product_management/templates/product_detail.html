{% extends "base.html" %}

{% block title %}تفاصيل المنتج{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-10">
        <div class="card">
            <div class="card-body" id="product-detail-content">
                <div class="row">
                    <div class="col-md-5 text-center">
                        {% if product.image_filename %}
                            <img src="{{ url_for('static', filename='uploads/' + product.image_filename) }}" 
                                 alt="{{ product.name }}"
                                 class="img-fluid rounded"
                                 style="max-height: 300px; width: 100%; object-fit: cover;">
                        {% else %}
                            <div class="bg-light rounded d-flex align-items-center justify-content-center" 
                                 style="height: 300px;">
                                <i class="fas fa-image fa-5x text-secondary"></i>
                            </div>
                        {% endif %}
                    </div>
                    
                    <div class="col-md-7">
                        <h2 class="mb-3">{{ product.name }}</h2>
                        
                        <div class="mb-3">
                            <span class="badge bg-primary fs-5">
                                <i class="fas fa-tag"></i> السعر
                            </span>
                            <h3 class="price-tag d-inline-block me-3">
                                {{ "%.2f"|format(product.price) }} دولار
                            </h3>
                        </div>
                        
                        <div class="mb-4">
                            <h5><i class="fas fa-info-circle"></i> تفاصيل المنتج</h5>
                            <p class="text-muted">{{ product.details }}</p>
                        </div>
                        
                        <div class="btn-group w-100">
                            <a href="edit_product.html?id={{ product.id }}" 
                               class="btn btn-warning">
                                <i class="fas fa-edit"></i> تعديل
                            </a>
                            <a href="#" 
                               class="btn btn-danger"
                               onclick="CrudManager.handleDelete('{{ product.id }}'); return false;">
                                <i class="fas fa-trash"></i> حذف
                            </a>
                            <a href="index.html" 
                               class="btn btn-secondary">
                                <i class="fas fa-arrow-right"></i> رجوع
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
